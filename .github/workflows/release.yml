name: 'Publish as release'

on:
  push:
    branches:
      - master

# This is the example from the readme.
# On each push to the `release` branch it will create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'blacksmith-6vcpu-macos-latest' # Blacksmith macOS is Apple Silicon ARM64.
            args: '--target aarch64-apple-darwin'
          - platform: 'blacksmith-6vcpu-macos-latest' # Cross-compile the Intel artifact on ARM64.
            args: '--target x86_64-apple-darwin'
          - platform: 'blacksmith-2vcpu-ubuntu-2204' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          - platform: 'blacksmith-2vcpu-windows-2025'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Require pinned shared source and private repository token
        env:
          SHARED_SOURCE_REVISION: ${{ vars.SHARED_JS_SOURCE_REVISION }}
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHARED_SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test -n "${CROSS_REPO_READ_TOKEN:-}" || { echo 'CROSS_REPO_READ_TOKEN is required.' >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: tachograph-card-client

      - uses: actions/checkout@v4
        with:
          repository: transportklok/shared.js
          ref: ${{ vars.SHARED_JS_SOURCE_REVISION }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: shared.js
          persist-credentials: false

      - name: Verify exact shared source revision
        env:
          SHARED_SOURCE_REVISION: ${{ vars.SHARED_JS_SOURCE_REVISION }}
        shell: bash
        run: test "$(git -C shared.js rev-parse HEAD)" = "$SHARED_SOURCE_REVISION"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build pinned shared dependency
        working-directory: shared.js
        env:
          npm_config_script_shell: bash
        run: |
          npm ci
          npm run build
          npm test

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macOS runners so it's in an `if` to slightly speed up Windows and Linux builds.
          targets: ${{ matrix.platform == 'blacksmith-6vcpu-macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'blacksmith-2vcpu-ubuntu-2204' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config libpcsclite-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: tachograph-card-client
        run: yarn install # change this to npm, pnpm or bun depending on which one you use.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tachograph-card-client
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
