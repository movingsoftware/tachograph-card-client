name: 'Publish as release'

# Installers only: draft GitHub releases for a manual install. Updates reach installed apps through publish-application-bundles.yml.

on:
  push:
    branches:
      - master

# This is the example from the readme.
# On each push to master it creates a draft installer release and uploads the matrix builds.

jobs:
  resolve_shared_source:
    name: Resolve the committed shared.js release pin
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    environment: tcc-production
    permissions:
      contents: read
    outputs:
      shared_source_repository: ${{ steps.shared.outputs.shared_source_repository }}
      shared_source_ref: ${{ steps.shared.outputs.shared_source_ref }}
      shared_source_sha: ${{ steps.shared.outputs.shared_source_sha }}
      tcc_source_sha: ${{ steps.shared.outputs.tcc_source_sha }}
    steps:
      - name: Checkout TCC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tachograph-card-client
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out TCC revision
        working-directory: tachograph-card-client
        env:
          EXPECTED_TCC_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TCC_SHA"

      - name: Resolve shared.js source
        id: shared
        working-directory: tachograph-card-client
        env:
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: node scripts/resolve-shared-js-source.mjs release

      - name: Keep shared.js source evidence
        uses: actions/upload-artifact@v4
        with:
          name: shared-js-source
          path: ${{ runner.temp }}/shared-js-source.json
          if-no-files-found: error
          retention-days: 90

  publish-tauri:
    needs: resolve_shared_source
    environment: tcc-production
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'blacksmith-6vcpu-macos-latest' # Blacksmith macOS is Apple Silicon ARM64.
            args: '--target aarch64-apple-darwin'
          - platform: 'blacksmith-6vcpu-macos-latest' # Cross-compile the Intel artifact on ARM64.
            args: '--target x86_64-apple-darwin'
          - platform: 'blacksmith-2vcpu-ubuntu-2204' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          - platform: 'blacksmith-2vcpu-windows-2025'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout TCC
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_shared_source.outputs.tcc_source_sha }}
          path: tachograph-card-client
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact shared.js source
        uses: actions/checkout@v4
        with:
          repository: transportklok/shared.js
          ref: ${{ needs.resolve_shared_source.outputs.shared_source_sha }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: shared.js
          persist-credentials: false

      - name: Verify exact TCC revision
        env:
          EXPECTED_TCC_SHA: ${{ needs.resolve_shared_source.outputs.tcc_source_sha }}
        run: test "$(git -C tachograph-card-client rev-parse HEAD)" = "$EXPECTED_TCC_SHA"

      - name: Verify exact shared.js commit
        env:
          EXPECTED_SHARED_SHA: ${{ needs.resolve_shared_source.outputs.shared_source_sha }}
        run: test "$(git -C shared.js rev-parse HEAD)" = "$EXPECTED_SHARED_SHA"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build pinned shared dependency
        working-directory: shared.js
        env:
          npm_config_script_shell: bash
        run: |
          npm ci
          npm run build
          npm test

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macOS runners so it's in an `if` to slightly speed up Windows and Linux builds.
          targets: ${{ matrix.platform == 'blacksmith-6vcpu-macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'blacksmith-2vcpu-ubuntu-2204' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config libpcsclite-dev libdbus-1-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: tachograph-card-client
        run: yarn install # change this to npm, pnpm or bun depending on which one you use.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tachograph-card-client
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
